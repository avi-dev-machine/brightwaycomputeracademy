services:
  - type: web
    name: brightway-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MONGODB_DB_NAME
        value: brightway
      - key: MONGODB_URI
        sync: false
      - key: SUPABASE_JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://brightwaycomputeracademy.vercel.app,http://localhost:3000
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
